name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part of the version to bump'
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Create Release PR
    runs-on: ubuntu-latest
    steps:
      - name: Ensure running on main
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Error: this workflow must be dispatched from main (got $GITHUB_REF)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Bump package version
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if [[ ! "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Current version '$CURRENT' is not a valid X.Y.Z version"
            exit 1
          fi

          # Updates package.json and keeps package-lock.json in sync so the
          # publish workflow can use `npm ci`.
          VERSION=$(npm version "${{ inputs.bump }}" --no-git-tag-version)
          VERSION="${VERSION#v}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Prepared ${{ inputs.bump }} bump: $VERSION (from $CURRENT)"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: release ${{ steps.version.outputs.version }}"
          branch: release/${{ steps.version.outputs.version }}
          title: "Release ${{ steps.version.outputs.version }}"
          body: |
            Bumps the package version to `${{ steps.version.outputs.version }}`.

            Once merged, manually run the **Publish Release** workflow to:
            - Publish the package to npm
            - Create git tag `v${{ steps.version.outputs.version }}`
            - Create the GitHub release
